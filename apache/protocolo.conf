# apache/protocolo.conf - VirtualHost para Ubuntu 24.04 + Apache2
# Copiar para /etc/apache2/sites-available/protocolo.conf
# Ajuste ServerName e DocumentRoot conforme sua VM

<VirtualHost *:80>
    ServerName protocolo.local
    # Se quiser acessar por IP, pode deixar sem ServerName e usar apenas IP
    DocumentRoot /var/www/protocolo

    <Directory /var/www/protocolo>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Uploads precisa de escrita pelo www-data
    <Directory /var/www/protocolo/uploads>
        Require all granted
        # Impede execução de PHP dentro de uploads (segurança)
        php_flag engine off
        # Alternativa para php-fpm: desative handler
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/protocolo_error.log
    CustomLog ${APACHE_LOG_DIR}/protocolo_access.log combined
</VirtualHost>

